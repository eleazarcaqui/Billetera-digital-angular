<div class="card shadow-sm h-100">
  <div class="card-body">
    <h2 class="h6 fw-bold mb-3">Nuevo movimiento</h2>
    <form (submit)="registrar($event)" novalidate>
      <div class="mb-3">
        <label for="tipo" class="form-label text-muted small mb-1">Tipo de movimiento</label>
        <select #selectorTipo id="tipo" class="form-select" (change)="actualizarTipo(selectorTipo.value)">
          <option value="Recarga">Recarga</option>
          <option value="Gasto">Gasto</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="monto" class="form-label text-muted small mb-1">Monto (S/)</label>
        <input
          #campoMonto
          id="monto"
          type="number"
          step="0.01"
          class="form-control"
          placeholder="0.00"
          [value]="montoTexto()"
          (input)="actualizarMonto(campoMonto.value)"
        />
      </div>

      @if (error()) {
        <div class="alert alert-danger py-2 small" role="alert">{{ error() }}</div>
      }

      <button type="submit" class="btn btn-primary w-100" [disabled]="!formularioValido()">
        Registrar movimiento
      </button>
    </form>
  </div>
</div>
