<div class="row g-4">
  <section class="col-md-6">
    <div class="card shadow-sm h-100">
      <div class="card-body">
        <span class="text-secondary small fw-bold text-uppercase">Saldo disponible</span>
        <p class="display-6 fw-bold text-success my-1">S/ {{ saldo().toFixed(2) }}</p>

        <h2 class="h6 fw-bold mt-4 mb-2">Movimientos</h2>
        <ul class="list-group">
          @for (movimiento of movimientos(); track movimiento) {
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <span class="badge" [class.text-bg-success]="movimiento.tipo === 'Recarga'" [class.text-bg-danger]="movimiento.tipo === 'Gasto'">
                {{ movimiento.tipo }}
              </span>
              <span class="fw-bold" [class.text-success]="movimiento.tipo === 'Recarga'" [class.text-danger]="movimiento.tipo === 'Gasto'">
                {{ movimiento.tipo === 'Recarga' ? '+' : '-' }} S/ {{ movimiento.monto.toFixed(2) }}
              </span>
            </li>
          }
        </ul>
        @if (movimientos().length === 0) {
          <p class="text-muted small mb-0">Aún no hay movimientos</p>
        }
      </div>
    </div>
  </section>

  <section class="col-md-6">
    <app-nuevo-movimiento [saldo]="saldo()" (movimientoSolicitado)="registrar($event)" />
  </section>
</div>
